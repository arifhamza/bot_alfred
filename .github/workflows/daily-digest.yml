name: Daily News Digest

# Why "every hour" and not "once a day at a fixed time"?
# GitHub Actions cron always runs in UTC and cannot be told "9 AM in
# whatever timezone the user picked" directly - and a fixed UTC time would
# drift by an hour whenever the user's timezone enters/leaves daylight
# saving time. Instead, this workflow runs every hour, and src/main.py
# checks the CURRENT local time (using the TIMEZONE secret/variable) and
# only actually fetches/sends when it's the configured digest hour. This
# is correct year-round with zero manual DST maintenance.
#
# Cost: on a public repository, GitHub Actions minutes are free and
# unlimited, so running hourly costs nothing. See README.md if you're
# using a private repository instead.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Ignore the hour/already-sent checks and run now"
        type: boolean
        default: false
      dry_run:
        description: "Build the digest and log it, but don't send or save"
        type: boolean
        default: false

permissions:
  contents: write   # needed so the workflow can commit the updated history file

concurrency:
  group: daily-news-digest
  cancel-in-progress: false   # never cancel a run that might be mid-send

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          DIGEST_HOUR: ${{ vars.DIGEST_HOUR }}
          FORCE_RUN: ${{ github.event.inputs.force_run == 'true' && '1' || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python -m src.main

      - name: Commit updated history (if it changed)
        run: |
          if ! git diff --quiet -- data/sent_history.json; then
            git config user.name "news-digest-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/sent_history.json
            git commit -m "Update sent-article history [skip ci]"
            git push
          else
            echo "No history changes to commit."
          fi
